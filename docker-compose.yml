# Database server PostgreSQL untuk development.
# Saat volume masih kosong, skrip di database/ dijalankan otomatis (urut nama file).
services:
  db:
    image: postgres:17-alpine
    container_name: money-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-money}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-money_secret}
      POSTGRES_DB: ${POSTGRES_DB:-money_management}
      TZ: Asia/Jakarta
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OCR lokal (PaddleOCR) untuk foto struk — opsional.
  # Jalankan dengan: docker compose --profile ocr up -d
  ocr:
    build: ./ocr-service
    container_name: money-ocr
    profiles: ["ocr"]
    restart: unless-stopped
    ports:
      - "${OCR_PORT:-8866}:8866"
    volumes:
      - ocr_models:/root/.paddlex   # cache model agar tidak diunduh ulang

volumes:
  db_data:
  ocr_models:
